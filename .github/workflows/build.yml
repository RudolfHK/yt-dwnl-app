name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Install ffmpeg (independent reader for the M4A tagging tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:test :engine-newpipe:test :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: audiosaver-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  # Real YouTube: resolve, download and merge a Creative-Commons video, check the MP4 with ffprobe.
  # Manual only ("Run workflow"): in Nov 2026 YouTube answered every GitHub runner with "Sign in to
  # confirm you're not a bot", so on push it would only ever be red. Run the same tests from a home
  # network instead: LIVE_YOUTUBE=1 ./gradlew :engine-newpipe:test --tests '*Live*'
  live-youtube:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Live YouTube tests
        env:
          LIVE_YOUTUBE: "1"
          LIVE_OUTPUT_DIR: ${{ github.workspace }}/live-output
        run: ./gradlew :engine-newpipe:test --tests '*Live*' --info --stacktrace
      - name: Upload live results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-youtube-results
          path: |
            live-output/
            engine-newpipe/build/reports/tests/
            engine-newpipe/build/test-results/

  # A real Android system: merge, save through MediaStore and read back the way the phone does.
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/**

  # A version tag (v1.2, v1.2.3) publishes a release APK. The app's update check compares its own
  # version with the latest release here, and tells users when a newer NewPipeExtractor is out.
  # Signed with the release key when the AUDIOSAVER_KEYSTORE_BASE64 / _PASSWORD / KEY_ALIAS /
  # KEY_PASSWORD secrets exist, otherwise with a debug key (fine for personal installs).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.AUDIOSAVER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AUDIOSAVER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret: signing with a debug key."
          fi
      - name: Build release APK
        env:
          AUDIOSAVER_VERSION_NAME: ${{ github.ref_name }}
          AUDIOSAVER_VERSION_CODE: ${{ github.run_number }}
          AUDIOSAVER_KEYSTORE_PASSWORD: ${{ secrets.AUDIOSAVER_KEYSTORE_PASSWORD }}
          AUDIOSAVER_KEY_ALIAS: ${{ secrets.AUDIOSAVER_KEY_ALIAS }}
          AUDIOSAVER_KEY_PASSWORD: ${{ secrets.AUDIOSAVER_KEY_PASSWORD }}
        run: |
          export AUDIOSAVER_VERSION_NAME="${AUDIOSAVER_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "AudioSaver-${AUDIOSAVER_VERSION_NAME}.apk"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: AudioSaver-*.apk
          generate_release_notes: true
