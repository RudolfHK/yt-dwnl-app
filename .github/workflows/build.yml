name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Install ffmpeg (independent reader for the M4A tagging tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:test :engine-newpipe:test :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: audiosaver-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
